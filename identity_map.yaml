# Source account -> person.
#
# The spine never guesses at identity. It matches on verified email, then on
# this file, and otherwise leaves the account unresolved and says so. A false
# merge is undetectable once it has happened and silently corrupts every
# per-person number downstream; an unresolved account is visible and fixable.
# That asymmetry is why this file is committed and reviewable rather than
# inferred at runtime.
#
# Format:  <source>:<account id>: <person id>
# Person ids are the roster in visa_platform/docs/requirements/index.md.

# --- Confluence -------------------------------------------------------------
# Mechanical: the space's own handles are @shubham.mujumdar1..10 and the roster
# numbers them identically. No judgement involved.
confluence:shubham.mujumdar1: p1
confluence:shubham.mujumdar2: p2
confluence:shubham.mujumdar3: p3
confluence:shubham.mujumdar4: p4
